# React frontend (nginx). It serves the app and forwards /api and /hubs to the API service,
# so users reach everything through this one service.
#
# Outside Development the API marks the refresh-token cookie as Secure, so this service must be
# exposed over HTTPS (terminate TLS at an Ingress or the load balancer in front of it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: senicpos-web
  namespace: senicpos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: senicpos-web
  template:
    metadata:
      labels:
        app: senicpos-web
    spec:
      containers:
      - name: senicpos-web
        image: senicpos-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: API_UPSTREAM
          value: "http://senicpos-api-service:80"
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: senicpos-web-service
  namespace: senicpos
spec:
  selector:
    app: senicpos-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
