# The API must run as ONE replica for now. It keeps the push-notification queue and the
# SignalR groups in memory, so with several replicas live updates would only reach users
# connected to the same pod. Running more needs a Redis backplane and a durable queue first
# (docs/project/09-improvement-plan.md, phase D). For the same reason there is no autoscaler.
#
# The API does not migrate the database in Production: apply the migrations before deploying
# (see DEPLOYMENT.md), or set Database__MigrateOnStartup=true, which is safe with one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: senicpos-api
  namespace: senicpos
spec:
  replicas: 1
  # Replace the pod instead of running old and new side by side, which would be two instances.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: senicpos-api
  template:
    metadata:
      labels:
        app: senicpos-api
    spec:
      containers:
      - name: senicpos-api
        image: senicpos-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: senicpos-api-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__PostgreSQL
          valueFrom:
            secretKeyRef:
              name: senicpos-db-secret
              key: postgres-connection
        # Signing key for access tokens. The API refuses to start without it. Create the
        # secret yourself (see DEPLOYMENT.md); it is deliberately not stored in this repo.
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: senicpos-jwt-secret
              key: jwt-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: senicpos-api-service
  namespace: senicpos
spec:
  selector:
    app: senicpos-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
