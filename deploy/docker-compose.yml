# Production stack for Senic POS, deployed by Portainer from this Git repository
# (Stacks → Add stack → Git Repository, compose path: deploy/docker-compose.yml).
# Setup guide: deploy/README.md
#
# Values written as ${NAME} come from the stack's environment variables in Portainer.
# ${NAME:?message} means the stack refuses to start until that variable is set.
#
# The images are built and pushed by .github/workflows/deploy.yml.

# Shared by the two backup services below. "$$" is a literal "$" for the shell.
# A dump is written under a temporary name, checked, and only then given its final name, so
# a file called *.dump is always a complete, readable backup.
x-backup: &backup
  image: postgres:16-alpine
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - db-backups:/backups
  networks:
    - internal
  entrypoint: ["/bin/sh", "-c"]
  command:
    - |
      set -eu
      dump() {
        name="$$1-$$(date -u +%Y%m%dT%H%M%SZ)$$2"
        pg_dump -Fc -f "/backups/$$name.partial" \
          && pg_restore --list "/backups/$$name.partial" > /dev/null \
          && mv "/backups/$$name.partial" "/backups/$$name.dump" \
          && echo "backup written: $$name.dump"
      }
      if [ "$$BACKUP_MODE" = "before-deploy" ]; then
        dump predeploy "-$$(printf %s "$$DEPLOY_TAG" | tr -c 'A-Za-z0-9._-' '_')"
        ls -1t /backups/predeploy-*.dump | tail -n +$$((BACKUP_KEEP_PREDEPLOY + 1)) | xargs -r rm -f
        exit 0
      fi
      while true; do
        recent="$$(find /backups -name 'scheduled-*.dump' -mmin -$$((BACKUP_INTERVAL_HOURS * 60 - 10)) | head -n 1)"
        if [ -z "$$recent" ]; then
          if dump scheduled ""; then
            find /backups -name 'scheduled-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          else
            echo "backup FAILED; trying again in 5 minutes" >&2
            rm -f /backups/scheduled-*.partial
          fi
        fi
        sleep 300
      done

x-backup-environment: &backup-environment
  PGHOST: postgres
  PGUSER: postgres
  PGDATABASE: SenicPosDb
  PGPASSWORD: ${POSTGRES_PASSWORD}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: SenicPosDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the stack environment variables}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SenicPosDb"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the API talks to the database.

  # Runs once on every deployment, before the API starts and migrates the database. If the dump
  # fails, the API of the new version does not start: no backup, no migration.
  backup-before-deploy:
    <<: *backup
    restart: "no"
    environment:
      <<: *backup-environment
      BACKUP_MODE: before-deploy
      # Part of the file name. A new tag also makes this container run again.
      DEPLOY_TAG: ${IMAGE_TAG:-latest}
      BACKUP_KEEP_PREDEPLOY: ${BACKUP_KEEP_PREDEPLOY:-5}

  # Dumps the database every BACKUP_INTERVAL_HOURS and deletes dumps older than BACKUP_KEEP_DAYS.
  # The dumps are on this server; `backup-offsite` below copies them elsewhere once a
  # destination is set. Restore and on-demand backups: deploy/README.md.
  backup:
    <<: *backup
    restart: unless-stopped
    environment:
      <<: *backup-environment
      BACKUP_MODE: scheduled
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    healthcheck:
      # Unhealthy when the newest scheduled dump is more than two hours overdue.
      test: ["CMD-SHELL", "find /backups -name 'scheduled-*.dump' -mmin -$$(( ${BACKUP_INTERVAL_HOURS:-24} * 60 + 120 )) | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 2m
      start_interval: 5s

  # Copies every finished dump to S3-compatible storage outside this server (AWS S3,
  # Cloudflare R2, Backblaze B2, Wasabi, MinIO, ...), so a lost server does not take the
  # backups with it. Does nothing until BACKUP_S3_BUCKET is set. A copy that fails is tried
  # again five minutes later; files already copied are not sent again.
  backup-offsite:
    image: rclone/rclone:1.76
    restart: unless-stopped
    volumes:
      # Read-only: this service can never damage the local dumps.
      - db-backups:/backups:ro
    networks:
      - internal
    environment:
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      # Folder inside the bucket. Use a different one per installation sharing a bucket.
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-senic-pos}
      # 0 keeps every copy for ever (or leave deletion to a lifecycle rule of the bucket).
      BACKUP_OFFSITE_KEEP_DAYS: ${BACKUP_OFFSITE_KEEP_DAYS:-90}
      # rclone reads its remote named "offsite" from these.
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      # The bucket must exist already; the access key needs no permission to create buckets.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$$BACKUP_S3_BUCKET" ]; then
          echo "off-site copy is OFF: set BACKUP_S3_BUCKET (deploy/README.md). Backups exist on this server only."
          while true; do sleep 3600; done
        fi
        dest="offsite:$$BACKUP_S3_BUCKET/$$BACKUP_S3_PREFIX"
        echo "copying backups to $$dest"
        while true; do
          # Only *.dump: a dump still being written has another name.
          if rclone copy /backups "$$dest" --include '*.dump' --stats-one-line -v; then
            touch /tmp/last-success
            if [ "$$BACKUP_OFFSITE_KEEP_DAYS" -gt 0 ]; then
              rclone delete "$$dest" --include '*.dump' --min-age "$$BACKUP_OFFSITE_KEEP_DAYS"d \
                || echo "could not delete old off-site copies" >&2
            fi
          else
            echo "off-site copy FAILED; trying again in 5 minutes" >&2
          fi
          sleep 300
        done
    healthcheck:
      # Healthy while off, and while the last successful copy is less than 30 minutes old.
      test: ["CMD-SHELL", "[ -z \"$$BACKUP_S3_BUCKET\" ] || find /tmp/last-success -mmin -30 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 2m
      start_interval: 5s

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/picthaisky}/senic-pos-saas-system-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backup-before-deploy:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Do not use ";" in the password: it separates the parts of this connection string.
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=SenicPosDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      # One API container, so it can safely apply database migrations when it starts.
      Database__MigrateOnStartup: "true"
      # Signing key for access tokens, at least 32 characters. Changing it signs everyone out.
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY (32+ random characters) in the stack environment variables}
      Business__TimeZone: ${BUSINESS_TIMEZONE:-Asia/Bangkok}
      # The API is only reachable through nginx on the private Docker network, so forwarded
      # client addresses are trusted from private ranges. FORWARD_LIMIT is the number of proxies
      # in front of the API: nginx plus your HTTPS reverse proxy = 2.
      ForwardedHeaders__TrustedNetworks__0: 10.0.0.0/8
      ForwardedHeaders__TrustedNetworks__1: 172.16.0.0/12
      ForwardedHeaders__TrustedNetworks__2: 192.168.0.0/16
      ForwardedHeaders__ForwardLimit: ${FORWARD_LIMIT:-2}
      # First user of a new installation. Used once; see deploy/README.md.
      Bootstrap__TenantId: ${BOOTSTRAP_TENANT_ID:-}
      Bootstrap__OwnerEmail: ${BOOTSTRAP_OWNER_EMAIL:-}
      Bootstrap__OwnerPassword: ${BOOTSTRAP_OWNER_PASSWORD:-}
      # Optional: push notifications (all three, or none).
      Push__PublicKey: ${PUSH_PUBLIC_KEY:-}
      Push__PrivateKey: ${PUSH_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_SUBJECT:-}
    volumes:
      - api-logs:/app/logs
    networks:
      - internal
    # The image has its own HEALTHCHECK (GET /health); `web` waits for it below.

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/picthaisky}/senic-pos-saas-system-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      # The only published port. Put an HTTPS reverse proxy in front of it: outside development
      # the sign-in cookie is Secure, so sign-in does not survive a reload over plain http.
      - "${WEB_PORT:-8080}:80"
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
  api-logs:
  db-backups:
