name: Deploy

# main -> tests -> images on GHCR -> Portainer redeploys the Git-based stack.
# Setup (secrets, Portainer stack): deploy/README.md
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - .github/workflows/deploy.yml
      - .github/workflows/ci.yml
  workflow_dispatch:

# One deployment at a time, in order. A running deployment is never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build ${{ matrix.name }} image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: vars
        run: |
          # Registry paths must be lower case. Each commit gets its own immutable tag.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/senic-pos-saas-system-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy with Portainer
    needs: images
    runs-on: ubuntu-latest
    # Secrets and variables live in this GitHub environment; add required reviewers to it to
    # make deployments wait for approval.
    environment: production
    env:
      IMAGE_TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Until Portainer is set up there is nothing to deploy to. The images are built and
      # pushed all the same; the run says "not deployed" instead of failing, so that a red run
      # on main always means something is broken.
      - name: Is Portainer set up?
        id: portainer
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_API_KEY$PORTAINER_WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Not deployed::The images were built, but no Portainer secret is set (PORTAINER_URL and PORTAINER_API_KEY, or PORTAINER_WEBHOOK_URL). See deploy/README.md."
            echo "**Not deployed.** The images for \`$IMAGE_TAG\` were built and pushed, but no Portainer secret is set in the \`production\` environment. See deploy/README.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Redeploy the stack
        if: ${{ steps.portainer.outputs.configured == 'true' }}
        env:
          # With an API key: pins the stack to this commit's images (IMAGE_TAG).
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_NAME: ${{ vars.PORTAINER_STACK_NAME }}
          # Without one: the stack's GitOps webhook, which redeploys the "latest" images.
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: node deploy/portainer.mjs deploy

      - name: Wait for the new version
        # Set the HEALTH_URL variable (e.g. https://pos.example.com/health) to enable this check.
        if: ${{ steps.portainer.outputs.configured == 'true' && vars.HEALTH_URL != '' }}
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          # Only the API path deploys an exact version; the webhook path deploys "latest",
          # which is the same build, so the check is valid for both.
          EXPECTED_VERSION: ${{ needs.images.outputs.tag }}
        run: node deploy/portainer.mjs wait-healthy

      - name: Smoke test of production
        # Set the SMOKE_URL variable (e.g. https://pos.example.com) to enable. Read-only: it
        # never changes data. With the SMOKE_* secrets of an Owner or Admin account it also
        # signs in and reads; without them it checks only what needs no account.
        if: ${{ steps.portainer.outputs.configured == 'true' && vars.SMOKE_URL != '' }}
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          SMOKE_TENANT_ID: ${{ secrets.SMOKE_TENANT_ID }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          # Only meaningful after the wait above; the webhook path does not pin a version.
          EXPECTED_VERSION: ${{ vars.HEALTH_URL != '' && needs.images.outputs.tag || '' }}
        run: node deploy/smoke-test.mjs
