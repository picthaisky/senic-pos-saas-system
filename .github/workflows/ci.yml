name: CI

# Runs on every pull request. deploy.yml calls it too for pushes to main, so nothing is
# deployed unless these checks pass on the exact commit being deployed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: backend
        run: dotnet test --configuration Release

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  deploy-files:
    name: Deployment files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the Portainer script
        run: node --test deploy/portainer.test.mjs

      - name: Validate the stack file
        # Placeholder values: this checks the syntax and that the required variables are wired.
        env:
          POSTGRES_PASSWORD: placeholder
          JWT_KEY: placeholder
        run: docker compose -f deploy/docker-compose.yml config --quiet

  stack:
    name: Stack end-to-end
    # The slowest job: only worth running once the fast checks pass.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the images
        run: |
          docker build --build-arg APP_VERSION=ci -t ghcr.io/picthaisky/senic-pos-saas-system-api:ci backend
          docker build -t ghcr.io/picthaisky/senic-pos-saas-system-web:ci frontend

      - name: Start the production stack
        run: |
          # Throw-away secrets and a first user for this run only.
          password="$(openssl rand -hex 12)"
          echo "::add-mask::$password"
          tenant="$(uuidgen)"
          {
            echo "IMAGE_TAG=ci"
            echo "WEB_PORT=8080"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_KEY=$(openssl rand -hex 32)"
            echo "BOOTSTRAP_TENANT_ID=$tenant"
            echo "BOOTSTRAP_OWNER_EMAIL=owner@ci.test"
            echo "BOOTSTRAP_OWNER_PASSWORD=$password"
          } > "$RUNNER_TEMP/stack.env"
          docker compose -p ci --env-file "$RUNNER_TEMP/stack.env" -f deploy/docker-compose.yml up -d --wait
          {
            echo "STACK_URL=http://localhost:8080"
            echo "STACK_TENANT_ID=$tenant"
            echo "STACK_EMAIL=owner@ci.test"
            echo "STACK_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Smoke test
        env:
          SMOKE_URL: ${{ env.STACK_URL }}
          SMOKE_TENANT_ID: ${{ env.STACK_TENANT_ID }}
          SMOKE_EMAIL: ${{ env.STACK_EMAIL }}
          SMOKE_PASSWORD: ${{ env.STACK_PASSWORD }}
          SMOKE_MODE: full
          EXPECTED_VERSION: ci
        run: node deploy/smoke-test.mjs

      - name: Backup and restore rehearsal
        run: |
          compose() { docker compose -p ci --env-file "$RUNNER_TEMP/stack.env" -f deploy/docker-compose.yml "$@"; }
          # The deployment itself must have produced a dump before the API started.
          compose exec -T backup sh -c 'ls /backups/predeploy-*.dump'
          # A dump taken now holds what the smoke test created; it must restore into an empty database.
          compose exec -T backup sh -c '
            set -eu
            pg_dump -Fc -f /backups/manual-ci.dump
            createdb restore_check
            pg_restore --no-owner -d restore_check /backups/manual-ci.dump
            live=$(psql -tAc "select count(*) from \"Orders\"")
            restored=$(psql -d restore_check -tAc "select count(*) from \"Orders\"")
            echo "orders: live=$live restored=$restored"
            [ "$live" -gt 0 ] && [ "$live" = "$restored" ]
            dropdb restore_check'

      - name: Off-site backup rehearsal
        run: |
          compose() { docker compose -p ci --env-file "$RUNNER_TEMP/stack.env" -f deploy/docker-compose.yml "$@"; }
          # A throw-away S3 server stands in for the real storage: rclone can serve one itself.
          key="$(openssl rand -hex 8)"; secret="$(openssl rand -hex 16)"
          echo "::add-mask::$secret"
          docker run -d --name s3 --network ci_internal --entrypoint sh rclone/rclone:1.76 -c \
            "mkdir -p /data/backups && exec rclone serve s3 /data --addr :9000 --auth-key '$key,$secret'"
          {
            echo "BACKUP_S3_BUCKET=backups"
            echo "BACKUP_S3_ENDPOINT=http://s3:9000"
            echo "BACKUP_S3_ACCESS_KEY_ID=$key"
            echo "BACKUP_S3_SECRET_ACCESS_KEY=$secret"
          } >> "$RUNNER_TEMP/stack.env"
          # Setting the destination and redeploying is all an operator does. The service is
          # healthy only once a copy has succeeded.
          compose up -d --wait backup-offsite
          here="$(compose exec -T backup sh -c 'cd /backups && sha256sum *.dump | sort')"
          there="$(docker exec s3 sh -c 'cd /data/backups/senic-pos && sha256sum *.dump | sort')"
          echo "$here"
          [ -n "$here" ] && [ "$here" = "$there" ]

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Live notifications over WebSockets
        working-directory: frontend
        env:
          SMOKE_URL: ${{ env.STACK_URL }}
          SMOKE_TENANT_ID: ${{ env.STACK_TENANT_ID }}
          SMOKE_EMAIL: ${{ env.STACK_EMAIL }}
          SMOKE_PASSWORD: ${{ env.STACK_PASSWORD }}
        run: node scripts/check-realtime.mjs

      - name: Browser tests
        working-directory: frontend
        env:
          E2E_URL: ${{ env.STACK_URL }}
          E2E_TENANT_ID: ${{ env.STACK_TENANT_ID }}
          E2E_EMAIL: ${{ env.STACK_EMAIL }}
          E2E_PASSWORD: ${{ env.STACK_PASSWORD }}
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Container logs
        if: failure()
        run: docker compose -p ci --env-file "$RUNNER_TEMP/stack.env" -f deploy/docker-compose.yml logs --no-color --tail 200

      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
